<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#6c5ce7">
<title>Hanzi Flashcards</title>

<style>
:root{
    --bg1:#f4f1ff; --bg2:#e8f7f1;
    --surface:#ffffff; --surface-2:#f1f0f9;
    --text:#1f1d2e; --muted:#6b6880;
    --primary:#6c5ce7; --accent:#00b894;
    --warn:#f39c12; --bad:#e17055; --ok:#00b894;
    --border:rgba(108,92,231,.15);
    --shadow:0 10px 30px rgba(60,40,140,.15);
    --radius:20px;
}
[data-theme="dark"]{
    --bg1:#14122a; --bg2:#0c1f1d;
    --surface:#1e1c36; --surface-2:#2a2748;
    --text:#f1f0ff; --muted:#a29fc4;
    --border:rgba(162,155,254,.2);
    --shadow:0 10px 30px rgba(0,0,0,.45);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{
    font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;
    color:var(--text);
    background:linear-gradient(135deg,var(--bg1),var(--bg2)) fixed;
    min-height:100vh; min-height:100dvh;
    display:flex; flex-direction:column;
    transition:background .3s,color .3s;
}
button{font:inherit;color:inherit}
.hanzi{font-family:"Noto Sans SC","PingFang SC","Microsoft YaHei","Hiragino Sans GB",sans-serif}

/* ---------- Header ---------- */
header{
    position:sticky; top:0; z-index:20;
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    padding:10px clamp(12px,4vw,32px);
    padding-top:max(10px,env(safe-area-inset-top));
    background:color-mix(in srgb,var(--surface) 82%,transparent);
    backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);
    border-bottom:1px solid var(--border);
}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:clamp(15px,4vw,19px);white-space:nowrap}
.logo{
    width:34px;height:34px;border-radius:10px;display:grid;place-items:center;
    background:linear-gradient(135deg,var(--primary),var(--accent));color:#fff;font-size:19px;
}
nav{display:flex;gap:4px;align-items:center}
.tab,.icon-btn{
    border:none;cursor:pointer;background:transparent;border-radius:12px;
    padding:8px 12px;font-weight:600;font-size:14px;transition:background .2s,color .2s;
}
.tab:hover,.icon-btn:hover{background:var(--surface-2)}
.tab.active{background:var(--primary);color:#fff}
.icon-btn{width:38px;height:38px;padding:0;display:grid;place-items:center;font-size:17px}

/* ---------- Layout ---------- */
main{flex:1;width:100%;max-width:1100px;margin:0 auto;padding:clamp(14px,4vw,30px);padding-bottom:max(30px,env(safe-area-inset-bottom))}
.view{display:none;animation:fade .3s ease}
.view.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.col{display:flex;flex-direction:column;align-items:center;gap:18px}

/* ---------- Buttons ---------- */
.btn{
    cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;
    padding:11px 20px;border-radius:14px;font-weight:700;font-size:15px;
    background:var(--surface);border:1px solid var(--border);
    box-shadow:0 4px 12px rgba(0,0,0,.06);
    transition:transform .15s,box-shadow .15s,background .2s,opacity .2s;
}
.btn:hover{transform:translateY(-2px);box-shadow:0 8px 18px rgba(0,0,0,.12)}
.btn:active{transform:scale(.96)}
.btn.primary{background:var(--primary);color:#fff;border-color:transparent}
.btn.ok{background:var(--ok);color:#fff;border-color:transparent}
.btn.warn{background:var(--warn);color:#fff;border-color:transparent}
.btn.sm{padding:8px 14px;font-size:13px;border-radius:12px}
.btn.on{background:var(--warn);color:#fff;border-color:transparent}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;align-items:center}

/* ---------- Learn ---------- */
.stats{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;font-size:13px;font-weight:700}
.chip{padding:5px 12px;border-radius:99px;background:var(--surface);border:1px solid var(--border);color:var(--muted);white-space:nowrap}
.chip.k{color:var(--ok)} .chip.l{color:var(--warn)}
.mastery{display:flex;height:8px;border-radius:99px;overflow:hidden;background:var(--surface-2);width:min(100%,520px)}
.mastery i{display:block;height:100%;transition:width .4s}
.mastery .k{background:var(--ok)} .mastery .l{background:var(--warn)}
.wrap520{width:min(100%,520px)}
.info-row{display:flex;justify-content:space-between;font-size:14px;color:var(--muted);font-weight:600;margin-bottom:6px}
.bar{height:6px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--primary),var(--accent));transition:width .35s}

.flashcard{width:min(100%,520px);aspect-ratio:3/2;perspective:1200px;cursor:pointer;outline:none}
.flashcard:focus-visible .card{outline:3px solid var(--primary);outline-offset:4px;border-radius:var(--radius)}
.card{width:100%;height:100%;position:relative;transform-style:preserve-3d;transition:transform .6s cubic-bezier(.4,.2,.2,1)}
.card.flip{transform:rotateY(180deg)}
.side{
    position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:8px;
    padding:20px;text-align:center;border-radius:var(--radius);
    backface-visibility:hidden;-webkit-backface-visibility:hidden;box-shadow:var(--shadow);overflow:hidden;
}
.front{background:var(--surface);border:1px solid var(--border)}
.back{background:linear-gradient(135deg,var(--primary),var(--accent));color:#fff;transform:rotateY(180deg)}
.t-hanzi{font-weight:700;font-size:clamp(56px,16vw,110px);line-height:1.1;word-break:break-all;font-family:"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif}
.t-pinyin{font-weight:700;font-size:clamp(34px,9vw,58px);line-height:1.2}
.t-meaning{font-weight:700;font-size:clamp(20px,5vw,30px);line-height:1.3}
.sub{font-size:clamp(14px,3.5vw,18px);opacity:.9;font-weight:500;max-width:90%}
.hint{position:absolute;bottom:10px;left:0;right:0;text-align:center;font-size:12px;color:var(--muted);letter-spacing:.03em}
.pill{position:absolute;top:12px;left:12px;font-size:11px;font-weight:800;padding:3px 10px;border-radius:99px;background:var(--surface-2);color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.pill.known{background:color-mix(in srgb,var(--ok) 18%,transparent);color:var(--ok)}
.pill.learning{background:color-mix(in srgb,var(--warn) 20%,transparent);color:var(--warn)}
.star-mark{position:absolute;top:10px;right:14px;font-size:20px}
.empty{text-align:center;color:var(--muted);padding:50px 20px;font-size:16px;line-height:1.6}
.empty .big{font-size:48px;margin-bottom:8px}
.shortcut{font-size:12px;color:var(--muted);text-align:center;line-height:1.9}
kbd{background:var(--surface-2);border:1px solid var(--border);border-radius:6px;padding:1px 6px;font-size:11px;font-family:inherit}

/* ---------- Quiz ---------- */
.panel{width:min(100%,560px);background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:clamp(18px,4vw,28px)}
.panel h2{font-size:22px;margin-bottom:6px}
.panel p.muted{color:var(--muted);font-size:14px;margin-bottom:16px;line-height:1.5}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px;text-align:left}
.field label{font-size:13px;font-weight:700;color:var(--muted)}
select,.search{
    font:inherit;font-size:15px;padding:11px 14px;border-radius:12px;border:1px solid var(--border);
    background:var(--surface-2);color:var(--text);outline:none;width:100%;
}
select:focus,.search:focus{border-color:var(--primary);box-shadow:0 0 0 4px color-mix(in srgb,var(--primary) 20%,transparent)}
.qz-head{display:flex;justify-content:space-between;align-items:center;font-size:14px;font-weight:700;color:var(--muted);margin-bottom:10px}
.qz-label{text-align:center;color:var(--muted);font-weight:700;font-size:14px;margin:6px 0 4px}
.qz-prompt{text-align:center;padding:14px 6px 20px;min-height:110px;display:flex;align-items:center;justify-content:center}
.qz-opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{
    cursor:pointer;padding:14px 10px;border-radius:14px;border:2px solid var(--border);background:var(--surface-2);
    font-weight:700;font-size:clamp(16px,4vw,20px);min-height:64px;display:flex;align-items:center;justify-content:center;text-align:center;
    transition:transform .15s,border-color .2s,background .2s;position:relative;line-height:1.3;
}
.opt.hz{font-size:clamp(28px,8vw,40px)}
.opt:hover:not(:disabled){transform:translateY(-2px);border-color:var(--primary)}
.opt .n{position:absolute;top:5px;left:9px;font-size:11px;color:var(--muted);font-weight:600}
.opt.correct{background:color-mix(in srgb,var(--ok) 25%,var(--surface));border-color:var(--ok)}
.opt.wrong{background:color-mix(in srgb,var(--bad) 25%,var(--surface));border-color:var(--bad)}
.opt:disabled{cursor:default}
.big-score{font-size:56px;font-weight:800;text-align:center;background:linear-gradient(135deg,var(--primary),var(--accent));-webkit-background-clip:text;background-clip:text;color:transparent}
.missed{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:14px 0}
.missed span{background:var(--surface-2);border:1px solid var(--border);border-radius:12px;padding:6px 12px;font-size:13px;line-height:1.4;text-align:center}
.missed b{display:block;font-size:22px}

/* ---------- Browse ---------- */
.list-top{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.list-top .search{flex:1;min-width:200px}
.cats{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.cat{cursor:pointer;border:1px solid var(--border);background:var(--surface);padding:6px 13px;border-radius:99px;font-size:13px;font-weight:700;color:var(--muted);transition:all .2s}
.cat:hover{border-color:var(--primary)}
.cat.active{background:var(--primary);color:#fff;border-color:transparent}
.count{color:var(--muted);font-size:14px;font-weight:600}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}
.item{
    position:relative;background:var(--surface);border:1px solid var(--border);border-radius:16px;
    padding:16px 10px 12px;text-align:center;cursor:pointer;box-shadow:0 4px 12px rgba(0,0,0,.05);
    transition:transform .2s,box-shadow .2s,border-color .2s;
}
.item:hover{transform:translateY(-4px);box-shadow:var(--shadow);border-color:var(--primary)}
.item b{display:block;font-size:34px;color:var(--primary);margin-bottom:2px}
.item em{display:block;font-style:normal;font-weight:700;font-size:14px}
.item span{display:block;font-size:12px;color:var(--muted);line-height:1.3;margin-top:3px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.dot{position:absolute;top:9px;left:9px;width:9px;height:9px;border-radius:50%;background:var(--surface-2)}
.dot.known{background:var(--ok)} .dot.learning{background:var(--warn)}
.item .st{position:absolute;top:5px;right:8px;font-size:13px}

/* ---------- Modal / toast ---------- */
.overlay{position:fixed;inset:0;z-index:50;background:rgba(10,8,30,.55);display:none;align-items:center;justify-content:center;padding:16px;backdrop-filter:blur(3px)}
.overlay.open{display:flex;animation:fade .2s}
.modal{width:min(100%,440px);max-height:92vh;overflow:auto;background:var(--surface);border:1px solid var(--border);border-radius:22px;box-shadow:var(--shadow);padding:22px;position:relative}
.modal h3{font-size:19px;margin-bottom:14px}
.close{position:absolute;top:12px;right:12px}
.writer-box{width:min(260px,70vw);aspect-ratio:1;margin:6px auto 10px;background:var(--surface-2);border-radius:18px;border:1px dashed var(--border);display:grid;place-items:center;position:relative}
.writer-box svg{display:block}
.writer-note{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:14px;font-size:13px;color:var(--muted);pointer-events:none}
.d-pinyin{text-align:center;font-size:26px;font-weight:800}
.d-meaning{text-align:center;color:var(--muted);margin:2px 0 12px;line-height:1.4}
.toggle{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;font-size:15px;font-weight:600}
.switch{position:relative;width:46px;height:26px;flex:none}
.switch input{opacity:0;width:0;height:0}
.switch span{position:absolute;inset:0;background:var(--surface-2);border:1px solid var(--border);border-radius:99px;transition:.2s;cursor:pointer}
.switch span::before{content:"";position:absolute;width:20px;height:20px;left:2px;top:2px;border-radius:50%;background:var(--muted);transition:.2s}
.switch input:checked+span{background:var(--primary)}
.switch input:checked+span::before{transform:translateX(20px);background:#fff}
hr{border:none;border-top:1px solid var(--border);margin:14px 0}
#toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,30px);opacity:0;z-index:80;background:var(--text);color:var(--surface);padding:10px 18px;border-radius:12px;font-size:14px;font-weight:600;transition:.3s;pointer-events:none;max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
.spinner{width:40px;height:40px;margin:0 auto 14px;border:4px solid var(--surface-2);border-top-color:var(--primary);border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---------- Responsive ---------- */
@media (max-width:560px){
    .tab .lbl{display:none}
    .tab{padding:8px 10px;font-size:17px}
    .brand span{display:none}
    .shortcut{display:none}
    .btn{padding:11px 16px;font-size:14px}
    #grid{grid-template-columns:repeat(2,1fr)}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

<body>
<header>
    <div class="brand"><div class="logo">汉</div><span>Hanzi Flashcards</span></div>
    <nav>
        <button class="tab active" id="tab-learn"  onclick="showView('learn')">🎴<span class="lbl"> Learn</span></button>
        <button class="tab"        id="tab-quiz"   onclick="showView('quiz')">🧠<span class="lbl"> Quiz</span></button>
        <button class="tab"        id="tab-browse" onclick="showView('browse')">📚<span class="lbl"> Browse</span></button>
        <button class="icon-btn" onclick="openSettings()" aria-label="Settings">⚙️</button>
        <button class="icon-btn" id="themeBtn" onclick="toggleTheme()" aria-label="Toggle theme">🌙</button>
    </nav>
</header>

<main>
    <div id="loading" class="empty"><div class="spinner"></div>Loading cards…</div>

    <!-- ================= LEARN ================= -->
    <section id="view-learn" class="view col" style="display:none">
        <div class="stats" id="stats"></div>
        <div class="mastery" title="Mastery"><i class="k" id="mK"></i><i class="l" id="mL"></i></div>

        <div id="emptyDeck" class="empty" style="display:none"></div>

        <div id="learnBody" class="col" style="width:100%">
            <div class="wrap520">
                <div class="info-row"><span id="info"></span><span id="percent"></span></div>
                <div class="bar"><i id="bar"></i></div>
            </div>

            <div class="flashcard" id="flashcard" tabindex="0" role="button" aria-label="Flip card" onclick="flipCard()">
                <div class="card" id="card">
                    <div class="side front">
                        <span class="pill" id="pill"></span><span class="star-mark" id="starMark"></span>
                        <div id="qText"></div>
                        <div class="sub" id="qSub"></div>
                        <div class="hint">Tap to flip</div>
                    </div>
                    <div class="side back">
                        <div id="aText"></div>
                        <div class="sub" id="aSub"></div>
                    </div>
                </div>
            </div>

            <div class="row">
                <button class="btn" onclick="prevCard()" aria-label="Previous card">← Prev</button>
                <button class="btn ok" onclick="speakCurrent()" aria-label="Play sound">🔊</button>
                <button class="btn primary" onclick="nextCard()" aria-label="Next card">Next →</button>
            </div>
            <div class="row">
                <button class="btn warn" onclick="mark('learning')">↺ Again</button>
                <button class="btn ok" onclick="mark('known')">✓ I know it</button>
            </div>
            <div class="row">
                <button class="btn sm" id="starBtn" onclick="toggleStarCurrent()">☆ Star</button>
                <button class="btn sm" onclick="openDetail(deck[pos])">✍️ Stroke order</button>
                <button class="btn sm" onclick="buildDeck()">🔀 Reshuffle</button>
            </div>
            <p class="shortcut"><kbd>←</kbd> <kbd>→</kbd> move · <kbd>Space</kbd> flip · <kbd>1</kbd> again · <kbd>2</kbd> know it · <kbd>S</kbd> sound · <kbd>F</kbd> star</p>
        </div>
    </section>

    <!-- ================= QUIZ ================= -->
    <section id="view-quiz" class="view col">
        <div class="panel" id="quizSetup">
            <h2>🧠 Quiz</h2>
            <p class="muted" id="quizSummary"></p>
            <div class="field">
                <label for="quizType">Question type</label>
                <select id="quizType" onchange="settings.quizType=this.value;saveSettings()">
                    <option value="mixed">Mixed</option>
                    <option value="h2m">Hanzi → Meaning</option>
                    <option value="h2p">Hanzi → Pinyin</option>
                    <option value="m2h">Meaning → Hanzi</option>
                    <option value="p2h">Pinyin → Hanzi</option>
                </select>
            </div>
            <div class="field">
                <label for="quizLen">Number of questions</label>
                <select id="quizLen" onchange="settings.quizLen=+this.value;saveSettings()">
                    <option value="10">10</option><option value="20">20</option><option value="30">30</option><option value="50">50</option>
                </select>
            </div>
            <div class="row"><button class="btn primary" onclick="startQuiz()">Start quiz</button></div>
        </div>

        <div class="panel" id="quizPlay" style="display:none">
            <div class="qz-head"><span id="qzProg"></span><span id="qzScore"></span></div>
            <div class="bar" style="margin-bottom:6px"><i id="qzBar"></i></div>
            <div class="qz-label" id="qzLabel"></div>
            <div class="qz-prompt" id="qzPrompt"></div>
            <div class="qz-opts" id="qzOpts"></div>
            <div class="row" style="margin-top:16px;min-height:46px">
                <button class="btn sm" onclick="speakQuiz()" aria-label="Play sound">🔊</button>
                <button class="btn primary" id="qzNext" style="visibility:hidden" onclick="nextQuestion()">Next →</button>
            </div>
        </div>

        <div class="panel" id="quizResult" style="display:none"></div>
    </section>

    <!-- ================= BROWSE ================= -->
    <section id="view-browse" class="view">
        <div class="list-top">
            <input class="search" id="search" type="search" placeholder="Search hanzi, pinyin (with or without tones) or meaning…" oninput="renderBrowse()">
            <span class="count" id="listCount"></span>
        </div>
        <div class="cats" id="cats"></div>
        <div id="grid"></div>
    </section>
</main>

<!-- ================= DETAIL / STROKE ORDER ================= -->
<div class="overlay" id="detailOv" onclick="if(event.target===this)closeModals()">
    <div class="modal">
        <button class="icon-btn close" onclick="closeModals()" aria-label="Close">✕</button>
        <div class="writer-box"><div id="writerBox"></div><div class="writer-note" id="writerNote"></div></div>
        <div class="d-pinyin" id="dPinyin"></div>
        <div class="d-meaning" id="dMeaning"></div>
        <div class="row">
            <button class="btn sm ok" onclick="speakText(detailCard().h)">🔊 Listen</button>
            <button class="btn sm" onclick="animateWriter()">▶ Animate</button>
            <button class="btn sm" onclick="practiceWriter()">✏️ Practice</button>
        </div>
        <hr>
        <div class="row">
            <button class="btn sm" id="dStar" onclick="toggleStarDetail()"></button>
            <button class="btn sm" id="dKnown" onclick="setDetailStatus('known')">✓ Known</button>
            <button class="btn sm" id="dLearn" onclick="setDetailStatus('learning')">↺ Learning</button>
        </div>
        <div class="row" style="margin-top:10px">
            <button class="btn sm primary" onclick="studyDetail()">🎴 Study this card</button>
        </div>
    </div>
</div>

<!-- ================= SETTINGS ================= -->
<div class="overlay" id="setOv" onclick="if(event.target===this)closeModals()">
    <div class="modal">
        <button class="icon-btn close" onclick="closeModals()" aria-label="Close">✕</button>
        <h3>⚙️ Settings</h3>
        <div class="field">
            <label for="sDir">Card direction</label>
            <select id="sDir" onchange="changeSetting('dir',this.value)">
                <option value="h2p">Hanzi → Pinyin &amp; meaning</option>
                <option value="p2h">Pinyin → Hanzi</option>
                <option value="m2h">Meaning → Hanzi</option>
            </select>
        </div>
        <div class="field">
            <label for="sCat">Category</label>
            <select id="sCat" onchange="changeSetting('cat',this.value)"></select>
        </div>
        <div class="field">
            <label for="sStatus">Show cards that are…</label>
            <select id="sStatus" onchange="changeSetting('status',this.value)">
                <option value="all">All</option>
                <option value="new">New (not studied yet)</option>
                <option value="learning">Still learning</option>
                <option value="known">Known</option>
                <option value="starred">Starred ⭐</option>
            </select>
        </div>
        <div class="toggle"><span>Shuffle cards</span><label class="switch"><input type="checkbox" id="sShuffle" onchange="changeSetting('shuffle',this.checked)"><span></span></label></div>
        <div class="toggle"><span>Auto-play sound</span><label class="switch"><input type="checkbox" id="sAuto" onchange="changeSetting('autoplay',this.checked)"><span></span></label></div>

const $ = id => document.getElementById(id);
const KEY_PROG = "hanzi-progress-v2", KEY_SET = "hanzi-settings-v2", KEY_THEME = "hanzi-theme";

/* ---------- storage ---------- */
function load(k, d){ try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch(e){ return d; } }
function save(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }

/* ---------- state ---------- */
let cards = [];                 // [{h,p,m,t}]
let deck = [], pos = 0, flipped = false, renderTimer = null;
let prog = load(KEY_PROG, {});  // { "hanzi|pinyin": {s:"known"|"learning", star:true} }
const settings = Object.assign(
    { dir:"h2p", cat:"all", status:"all", shuffle:true, autoplay:false, quizType:"mixed", quizLen:10 },
    load(KEY_SET, {})
);
const saveSettings = () => save(KEY_SET, settings);
const saveProg = () => save(KEY_PROG, prog);

/* ---------- helpers ---------- */
const keyOf  = c => c.h + "|" + c.p;
const entry  = c => prog[keyOf(c)] || {};
const statusOf = c => entry(c).s || "new";
const isStar = c => !!entry(c).star;
const pick = a => a[Math.floor(Math.random() * a.length)];
const norm = s => (s || "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "");
function shuffleArr(a){ for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function setStatus(c, s){ const e = Object.assign({}, entry(c)); e.s = s; prog[keyOf(c)] = e; saveProg(); }
function toggleStar(c){ const e = Object.assign({}, entry(c)); e.star = !e.star; prog[keyOf(c)] = e; saveProg(); }
let toastTimer;
function toast(msg){ const t = $("toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("show"), 2200); }

/* ---------- theme ---------- */
function applyTheme(t){ document.documentElement.setAttribute("data-theme", t); $("themeBtn").textContent = t === "dark" ? "☀️" : "🌙"; }
function toggleTheme(){
    const t = document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark";
    applyTheme(t);
    try { localStorage.setItem(KEY_THEME, t); } catch(e){}
}
(function(){
    let t = null; try { t = localStorage.getItem(KEY_THEME); } catch(e){}
    if (!t) t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
    applyTheme(t);
})();

/* ---------- data ---------- */
function normalizeRows(rows){
    return rows.filter(r => Array.isArray(r) && r[0] && r[1])
               .map(r => ({ h:String(r[0]), p:String(r[1]), m:r[2] ? String(r[2]) : "", t:r[3] ? String(r[3]) : "Original" }));
}
async function init(){
    let data = normalizeRows(EMBEDDED);
    try {
        const res = await fetch("hanzi.json", { cache:"no-cache" });
        if (res.ok) {
            const rows = normalizeRows(await res.json());
            if (rows.length >= data.length) data = rows;       // prefer the external file when it is at least as complete
        }
    } catch(e){}
    if (!data.length) {
        try {
            const res = await fetch("https://whois65.github.io/hanzi-quiz/hanzi.json");
            data = normalizeRows(await res.json());
        } catch(e){}
    }
    if (!data.length) {
        $("loading").innerHTML = "⚠️ Could not load the cards.<br><br><button class='btn primary' onclick='location.reload()'>Try again</button>";
        return;
    }
    cards = data;
    $("loading").style.display = "none";
    populateCategories();
    syncSettingsUI();
    showView("learn");
    buildDeck();
    renderBrowse();
}

/* ---------- views ---------- */
let view = "learn";
function showView(v){
    view = v;
    ["learn", "quiz", "browse"].forEach(n => {
        const sec = $("view-" + n);
        sec.classList.toggle("active", n === v);
        sec.style.display = n === v ? (n === "browse" ? "block" : "flex") : "none";
        $("tab-" + n).classList.toggle("active", n === v);
    });
    if (v === "quiz") quizSetupScreen();
    if (v === "browse") renderBrowse();
    window.scrollTo({ top:0 });
}

/* ---------- deck / filters ---------- */
function filteredIdx(){
    const out = [];
    cards.forEach((c, i) => {
        if (settings.cat !== "all" && c.t !== settings.cat) return;
        const s = settings.status;
        if (s === "starred") { if (!isStar(c)) return; }
        else if (s !== "all" && statusOf(c) !== s) return;
        out.push(i);
    });
    return out;
}
function buildDeck(){
    deck = filteredIdx();
    if (settings.shuffle) shuffleArr(deck);
    pos = 0;
    renderCard();
}
function populateCategories(){
    const counts = {};
    cards.forEach(c => counts[c.t] = (counts[c.t] || 0) + 1);
    const sel = $("sCat");
    sel.innerHTML = "";
    const add = (v, label) => { const o = document.createElement("option"); o.value = v; o.textContent = label; sel.appendChild(o); };
    add("all", `All categories (${cards.length})`);
    Object.keys(counts).forEach(k => add(k, `${k} (${counts[k]})`));
    if (settings.cat !== "all" && !counts[settings.cat]) settings.cat = "all";
}
function syncSettingsUI(){
    $("sDir").value = settings.dir; $("sCat").value = settings.cat; $("sStatus").value = settings.status;
    $("sShuffle").checked = !!settings.shuffle; $("sAuto").checked = !!settings.autoplay;
    $("quizType").value = settings.quizType; $("quizLen").value = String(settings.quizLen);
}
function changeSetting(k, v){
    settings[k] = v; saveSettings();
    if (k === "dir") renderCard(); else buildDeck();
    if (view === "quiz") quizSetupScreen();
}

/* ---------- flashcards ---------- */
function faces(c, dir){
    if (dir === "p2h") return { f:{ t:c.p, k:"pinyin" }, b:{ t:c.h, k:"hanzi", sub:c.m } };
    if (dir === "m2h") return { f:{ t:c.m || c.p, k:"meaning" }, b:{ t:c.h, k:"hanzi", sub:c.p } };
    return { f:{ t:c.h, k:"hanzi" }, b:{ t:c.p, k:"pinyin", sub:c.m } };
}
function updateStats(){
    let k = 0, l = 0;
    cards.forEach(c => { const s = statusOf(c); if (s === "known") k++; else if (s === "learning") l++; });
    const n = cards.length - k - l;
    $("stats").innerHTML = `<span class="chip k">✓ ${k} known</span><span class="chip l">↺ ${l} learning</span><span class="chip">● ${n} new</span>`;
    $("mK").style.width = (k / cards.length * 100) + "%";
    $("mL").style.width = (l / cards.length * 100) + "%";
}
function renderCard(){
    updateStats();
    const empty = !deck.length;
    $("learnBody").style.display = empty ? "none" : "flex";
    $("emptyDeck").style.display = empty ? "block" : "none";
    if (empty) {
        $("emptyDeck").innerHTML = `<div class="big">🎉</div>No cards match the current filters.<br>
            <button class="btn primary" style="margin-top:14px" onclick="settings.cat='all';settings.status='all';saveSettings();syncSettingsUI();buildDeck()">Show all cards</button>`;
        return;
    }
    if (pos >= deck.length) pos = 0;
    if (pos < 0) pos = deck.length - 1;

    const c = cards[deck[pos]], fc = faces(c, settings.dir);
    const wasFlipped = flipped;
    flipped = false;
    $("card").classList.remove("flip");

    const apply = () => {
        const q = $("qText"), a = $("aText");
        q.textContent = fc.f.t; q.className = "t-" + fc.f.k;
        a.textContent = fc.b.t; a.className = "t-" + fc.b.k;
        $("qSub").textContent = ""; $("aSub").textContent = fc.b.sub || "";
        const s = statusOf(c), pill = $("pill");
        pill.textContent = s; pill.className = "pill " + s;
        $("starMark").textContent = isStar(c) ? "⭐" : "";
        if (settings.autoplay && fc.f.k === "hanzi") speakText(c.h);
    };
    clearTimeout(renderTimer);
    if (wasFlipped) renderTimer = setTimeout(apply, 220); else apply();

    $("info").textContent = `${pos + 1} / ${deck.length} cards`;
    const pct = Math.round((pos + 1) / deck.length * 100);
    $("percent").textContent = pct + "%";
    $("bar").style.width = pct + "%";
    $("starBtn").textContent = isStar(c) ? "★ Starred" : "☆ Star";
    $("starBtn").classList.toggle("on", isStar(c));
}
function flipCard(){
    if (!deck.length) return;
    flipped = !flipped;
    $("card").classList.toggle("flip", flipped);
    const c = cards[deck[pos]];
    if (flipped && settings.autoplay && faces(c, settings.dir).b.k === "hanzi") speakText(c.h);
}
function nextCard(){ if (!deck.length) return; pos = (pos + 1) % deck.length; renderCard(); }
function prevCard(){ if (!deck.length) return; pos = (pos - 1 + deck.length) % deck.length; renderCard(); }
function mark(s){
    if (!deck.length) return;
    const idx = deck[pos];
    setStatus(cards[idx], s);
    if (s === "learning") {
        deck.splice(pos, 1);                                   // see it again a few cards later
        deck.splice(Math.min(deck.length, pos + 4), 0, idx);
        toast("↺ You'll see it again soon");
    } else {
        if (settings.status === "new" || settings.status === "learning") deck.splice(pos, 1);
        else pos++;
        toast("✓ Marked as known");
    }
    renderCard();
}
function toggleStarCurrent(){ if (!deck.length) return; toggleStar(cards[deck[pos]]); renderCard(); }

/* ---------- speech ---------- */
function speakText(text){
    if (!("speechSynthesis" in window)) { toast("Sound isn't supported in this browser"); return; }
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = "zh-CN"; u.rate = 0.85;
    speechSynthesis.speak(u);
}
const speakCurrent = () => deck.length && speakText(cards[deck[pos]].h);

/* ---------- browse ---------- */
let browseCat = "all";
function renderBrowse(){
    if (!cards.length) return;
    // category chips
    const cats = ["all", ...new Set(cards.map(c => c.t))];
    $("cats").innerHTML = "";
    cats.forEach(k => {
        const b = document.createElement("button");
        b.className = "cat" + (browseCat === k ? " active" : "");
        b.textContent = k === "all" ? "All" : k;
        b.onclick = () => { browseCat = k; renderBrowse(); };
        $("cats").appendChild(b);
    });
    const q = norm($("search").value.trim());
    const frag = document.createDocumentFragment();
    let n = 0;
    cards.forEach((c, i) => {
        if (browseCat !== "all" && c.t !== browseCat) return;
        if (q && !(c.h.includes(q) || norm(c.p).includes(q) || c.m.toLowerCase().includes(q))) return;
        n++;
        const el = document.createElement("div");
        el.className = "item"; el.tabIndex = 0;
        const s = statusOf(c);
        el.innerHTML = `<i class="dot ${s}"></i><i class="st">${isStar(c) ? "⭐" : ""}</i><b class="hanzi"></b><em></em><span></span>`;
        el.querySelector("b").textContent = c.h;
        el.querySelector("em").textContent = c.p;
        el.querySelector("span").textContent = c.m;
        el.onclick = () => openDetail(i);
        el.onkeydown = e => { if (e.key === "Enter") openDetail(i); };
        frag.appendChild(el);
    });
    $("grid").innerHTML = "";
    $("grid").appendChild(frag);
    $("listCount").textContent = `${n} card${n === 1 ? "" : "s"}`;
}

/* ---------- detail modal + stroke order ---------- */
let detailIdx = -1, writer = null, hwPromise = null;
const detailCard = () => cards[detailIdx];
function loadHW(){
    if (window.HanziWriter) return Promise.resolve();
    if (!hwPromise) hwPromise = new Promise((res, rej) => {
        const s = document.createElement("script");
        s.src = "https://cdn.jsdelivr.net/npm/hanzi-writer@3/dist/hanzi-writer.min.js";
        s.onload = res;
        s.onerror = () => { hwPromise = null; rej(new Error("load failed")); };
        document.head.appendChild(s);
    });
    return hwPromise;
}
const isDark = () => document.documentElement.getAttribute("data-theme") === "dark";
function openDetail(idx){
    if (idx === undefined || idx < 0) return;
    detailIdx = idx;
    const c = cards[idx];
    $("dPinyin").textContent = c.p;
    $("dMeaning").textContent = c.m || "";
    refreshDetailButtons();
    $("detailOv").classList.add("open");
    $("writerBox").innerHTML = "";
    writer = null;
    $("writerNote").textContent = "Loading stroke order…";
    loadHW().then(() => {
        if (detailIdx !== idx) return;
        const size = Math.min(260, Math.floor(window.innerWidth * 0.7));
        $("writerBox").innerHTML = "";
        writer = HanziWriter.create($("writerBox"), c.h, {
            width:size, height:size, padding:14, showOutline:true,
            strokeAnimationSpeed:1.2, delayBetweenStrokes:250,
            strokeColor: isDark() ? "#f1f0ff" : "#1f1d2e",
            outlineColor: isDark() ? "#4a4670" : "#d6d3ee",
            radicalColor:"#00b894", drawingColor:"#6c5ce7",
            onLoadCharDataSuccess: () => { $("writerNote").textContent = ""; },
            onLoadCharDataError: () => { $("writerNote").textContent = "Stroke data isn't available for this character."; }
        });
        writer.animateCharacter();
    }).catch(() => {
        $("writerBox").innerHTML = `<span class="hanzi" style="font-size:96px;font-weight:700">${c.h}</span>`;
        $("writerNote").textContent = "";
        toast("Stroke order needs an internet connection");
    });
}
function animateWriter(){ if (writer) { writer.cancelQuiz && writer.cancelQuiz(); writer.animateCharacter(); } }
function practiceWriter(){
    if (!writer) return;
    writer.quiz({ onComplete: () => toast("🎉 Nice writing!") });
    toast("Draw the strokes in order");
}
function refreshDetailButtons(){
    const c = detailCard(), s = statusOf(c);
    $("dStar").textContent = isStar(c) ? "★ Starred" : "☆ Star";
    $("dStar").classList.toggle("on", isStar(c));
    $("dKnown").classList.toggle("ok", s === "known");
    $("dLearn").classList.toggle("warn", s === "learning");
}
function toggleStarDetail(){ toggleStar(detailCard()); refreshDetailButtons(); renderCard(); if (view === "browse") renderBrowse(); }
function setDetailStatus(s){ setStatus(detailCard(), s); refreshDetailButtons(); renderCard(); if (view === "browse") renderBrowse(); }
function studyDetail(){
    const idx = detailIdx;
    closeModals();
    if (!deck.includes(idx)) deck.unshift(idx);
    pos = deck.indexOf(idx);
    showView("learn");
    renderCard();
}
function openSettings(){ syncSettingsUI(); $("setOv").classList.add("open"); }
function closeModals(){
    $("detailOv").classList.remove("open");
    $("setOv").classList.remove("open");
    detailIdx = -1; writer = null;
}

/* ---------- progress import / export ---------- */
function exportProgress(){
    const blob = new Blob([JSON.stringify({ version:2, progress:prog }, null, 1)], { type:"application/json" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "hanzi-progress.json";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
function importProgress(input){
    const f = input.files && input.files[0];
    if (!f) return;
    const r = new FileReader();
    r.onload = () => {
        try {
            const data = JSON.parse(r.result);
            const p = data.progress || data;
            let n = 0;
            Object.keys(p).forEach(k => {
                const v = p[k];
                if (v && typeof v === "object") { prog[k] = { s:["known","learning"].includes(v.s) ? v.s : undefined, star:!!v.star }; n++; }
            });
            saveProg(); buildDeck(); renderBrowse();
            toast(`Imported ${n} cards`);
        } catch(e){ toast("That file isn't valid progress data"); }
        input.value = "";
    };
    r.readAsText(f);
}
function resetProgress(){
    if (!confirm("Reset all progress (known / learning / stars)? This can't be undone.")) return;
    prog = {}; saveProg(); buildDeck(); renderBrowse(); toast("Progress reset");
}

/* ---------- quiz ---------- */
const QTYPES = {
    h2m:["hanzi","meaning","What does this mean?"],
    h2p:["hanzi","pinyin","Pick the pinyin"],
    m2h:["meaning","hanzi","Which character means this?"],
    p2h:["pinyin","hanzi","Which character is read like this?"]
};
const val = (c, k) => k === "hanzi" ? c.h : k === "pinyin" ? c.p : c.m;
let quiz = null, quizTimer = null;

function showQuizPanel(name){
    $("quizSetup").style.display  = name === "setup"  ? "block" : "none";
    $("quizPlay").style.display   = name === "play"   ? "block" : "none";
    $("quizResult").style.display = name === "result" ? "block" : "none";
}
function quizSetupScreen(){
    clearTimeout(quizTimer);
    const n = filteredIdx().length;
    const cat = settings.cat === "all" ? "all categories" : settings.cat;
    const st = { all:"all cards", new:"new cards", learning:"cards you're still learning", known:"known cards", starred:"starred cards" }[settings.status];
    $("quizSummary").textContent = `Using ${st} from ${cat} (${n} available). Change this in ⚙️ Settings. Wrong answers are added to "Learning".`;
    $("quizType").value = settings.quizType; $("quizLen").value = String(settings.quizLen);
    showQuizPanel("setup");
}
function makeQuestion(idx, pool){
    const c = cards[idx];
    let type = settings.quizType === "mixed" ? pick(Object.keys(QTYPES)) : settings.quizType;
    let [qk, ak, label] = QTYPES[type];
    if (!val(c, qk) || !val(c, ak)) { type = "h2p"; [qk, ak, label] = QTYPES[type]; }
    const answer = val(c, ak), used = new Set([answer]), opts = [answer];
    const tryPool = list => {
        for (const j of shuffleArr(list.slice())) {
            if (opts.length >= 4) break;
            if (j === idx) continue;
            const d = cards[j];
            if (val(d, qk) === val(c, qk)) continue;          // same question text -> could also be a right answer
            const t = val(d, ak);
            if (!t || used.has(t)) continue;
            used.add(t); opts.push(t);
        }
    };
    tryPool(pool);
    if (opts.length < 4) tryPool(cards.map((_, i) => i));
    return { idx, type, qk, ak, label, q:val(c, qk), answer, opts:shuffleArr(opts) };
}
function startQuiz(onlyIdx){
    const base = filteredIdx();
    const ids = Array.isArray(onlyIdx) ? onlyIdx : shuffleArr(base.slice()).slice(0, settings.quizLen);
    if (ids.length < 1 || cards.length < 4) { toast("Not enough cards for a quiz — adjust your filters"); return; }
    const pool = base.length >= 8 ? base : cards.map((_, i) => i);
    quiz = { qs: ids.map(i => makeQuestion(i, pool)), i:0, score:0, streak:0, best:0, missed:[], locked:false };
    showQuizPanel("play");
    renderQuestion();
}
function renderQuestion(){
    const q = quiz.qs[quiz.i];
    quiz.locked = false;
    $("qzProg").textContent = `Question ${quiz.i + 1} / ${quiz.qs.length}`;
    $("qzScore").textContent = `Score ${quiz.score}${quiz.streak > 1 ? "  🔥" + quiz.streak : ""}`;
    $("qzBar").style.width = (quiz.i / quiz.qs.length * 100) + "%";
    $("qzLabel").textContent = q.label;
    const p = $("qzPrompt");
    p.innerHTML = `<div class="t-${q.qk}"></div>`;
    p.firstChild.textContent = q.q;
    const box = $("qzOpts");
    box.innerHTML = "";
    q.opts.forEach((o, i) => {
        const b = document.createElement("button");
        b.className = "opt" + (q.ak === "hanzi" ? " hz hanzi" : "");
        b.innerHTML = `<span class="n">${i + 1}</span><span></span>`;
        b.lastChild.textContent = o;
        b.onclick = () => answerQuestion(i);
        box.appendChild(b);
    });
    $("qzNext").style.visibility = "hidden";
    if (settings.autoplay && q.qk === "hanzi") speakText(q.q);
}
function answerQuestion(i){
    if (!quiz || quiz.locked) return;
    quiz.locked = true;
    const q = quiz.qs[quiz.i], buttons = [...$("qzOpts").children];
    const ok = q.opts[i] === q.answer;
    buttons.forEach((b, j) => {
        b.disabled = true;
        if (q.opts[j] === q.answer) b.classList.add("correct");
        else if (j === i) b.classList.add("wrong");
    });
    if (ok) {
        quiz.score++; quiz.streak++; quiz.best = Math.max(quiz.best, quiz.streak);
    } else {
        quiz.streak = 0; quiz.missed.push(q.idx);
        setStatus(cards[q.idx], "learning");
    }
    $("qzScore").textContent = `Score ${quiz.score}${quiz.streak > 1 ? "  🔥" + quiz.streak : ""}`;
    $("qzBar").style.width = ((quiz.i + 1) / quiz.qs.length * 100) + "%";
    $("qzNext").textContent = quiz.i + 1 >= quiz.qs.length ? "See results" : "Next →";
    $("qzNext").style.visibility = "visible";
    if (ok) quizTimer = setTimeout(nextQuestion, 900);
}
function nextQuestion(){
    if (!quiz || !quiz.locked) return;
    clearTimeout(quizTimer);
    quiz.i++;
    if (quiz.i >= quiz.qs.length) return showResults();
    renderQuestion();
}
function speakQuiz(){
    if (!quiz) return;
    const q = quiz.qs[quiz.i];
    speakText(cards[q.idx].h);
}
function showResults(){
    updateStats(); renderCard();
    const total = quiz.qs.length, pct = Math.round(quiz.score / total * 100);
    const msg = pct === 100 ? "Perfect! 🎉" : pct >= 80 ? "Great job! 👏" : pct >= 50 ? "Good effort — keep going 💪" : "Keep practising, you'll get there 🌱";
    const missed = [...new Set(quiz.missed)];
    const panel = $("quizResult");
    panel.innerHTML = `<h2 style="text-align:center">${msg}</h2>
        <div class="big-score">${quiz.score} / ${total}</div>
        <p class="muted" style="text-align:center">${pct}% correct · best streak ${quiz.best}</p>
        ${missed.length ? `<div class="qz-label">To review (added to Learning)</div><div class="missed" id="missedList"></div>` : ""}
        <div class="row">
            ${missed.length ? `<button class="btn warn" id="retryBtn">Retry missed</button>` : ""}
            <button class="btn primary" onclick="startQuiz()">New quiz</button>
            <button class="btn" onclick="quizSetupScreen()">Options</button>
        </div>`;
    if (missed.length) {
        const list = $("missedList");
        missed.forEach(i => {
            const c = cards[i], s = document.createElement("span");
            s.innerHTML = `<b class="hanzi"></b><i></i>`;
            s.querySelector("b").textContent = c.h;
            s.querySelector("i").textContent = `${c.p}${c.m ? " · " + c.m : ""}`;
            s.querySelector("i").style.fontStyle = "normal";
            s.style.cursor = "pointer";
            s.onclick = () => openDetail(i);
            list.appendChild(s);
        });
        $("retryBtn").onclick = () => startQuiz(missed);
    }
    showQuizPanel("result");
}

/* ---------- keyboard & touch ---------- */
document.addEventListener("keydown", e => {
    if (e.target.tagName === "INPUT" || e.target.tagName === "SELECT" || e.target.tagName === "TEXTAREA") return;
    if (e.key === "Escape") { closeModals(); return; }
    if ($("detailOv").classList.contains("open") || $("setOv").classList.contains("open")) return;
    if (view === "learn" && deck.length) {
        if (e.key === "ArrowRight") nextCard();
        else if (e.key === "ArrowLeft") prevCard();
        else if (e.key === " " || e.key === "Enter") { e.preventDefault(); flipCard(); }
        else if (e.key === "1") mark("learning");
        else if (e.key === "2") mark("known");
        else if (e.key.toLowerCase() === "s") speakCurrent();
        else if (e.key.toLowerCase() === "f") toggleStarCurrent();
    } else if (view === "quiz" && quiz && $("quizPlay").style.display !== "none") {
        if (["1", "2", "3", "4"].includes(e.key)) answerQuestion(+e.key - 1);
        else if (e.key === "Enter" || e.key === " " || e.key === "ArrowRight") { e.preventDefault(); nextQuestion(); }
    }
});

let touchX = null;
const fcEl = $("flashcard");
fcEl.addEventListener("touchstart", e => { touchX = e.touches[0].clientX; }, { passive:true });
fcEl.addEventListener("touchend", e => {
    if (touchX === null) return;
    const dx = e.changedTouches[0].clientX - touchX;
    touchX = null;
    if (Math.abs(dx) > 50) {
        fcEl.style.pointerEvents = "none";                  // swallow the click that follows a swipe
        setTimeout(() => fcEl.style.pointerEvents = "", 60);
        dx < 0 ? nextCard() : prevCard();
    }
});

init();
</script>
